<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナンバータッチ</title>
<style>
body{
 text-align:center;
 font-family:sans-serif;
}
button{
 width:80px;
 height:80px;
 font-size:40px;
 margin:10px;
}
</style>
</head>
<body>

<h1>ナンバータッチ</h1>
<p id="message">1を押そう！</p>

<button onclick="check(1)">1</button>
<button onclick="check(2)">2</button>
<button onclick="check(3)">3</button>

<script>
let nextNum = 1;

function check(num){

 if(num === nextNum){

   nextNum++;

   if(nextNum <= 3){
     document.getElementById("message").textContent =
       nextNum + "を押そう！";
   }else{
     document.getElementById("message").textContent =
       "クリア！";
   }

 }else{

   document.getElementById("message").textContent =
     "ちがうよ！";
 }

}
</script>

</body>
</html>
