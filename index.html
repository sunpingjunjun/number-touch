<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナンバータッチ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f0f8ff;
}

h1{
  color:#003366;
}

#message{
  font-size:28px;
  font-weight:bold;
  margin:10px;
}

#game{
  position:relative;
  width:100vw;
  height:75vh;
}

.number{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  border:none;
  background:#4da6ff;
  color:white;
  font-size:36px;
  font-weight:bold;
  cursor:pointer;
}

.correct{
  background:#4caf50;
}

.hint{
  background:orange !important;
  animation:blink 0.8s infinite;
}

@keyframes blink{
  50%{
    opacity:0.3;
  }
}

#clear{
  font-size:40px;
  color:green;
  margin-top:10px;
}

.restart{
  font-size:28px;
  padding:15px 30px;
  border:none;
  border-radius:12px;
  background:#ff9800;
  color:white;
}
</style>
</head>
