<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナンバータッチ</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    text-align:center;
    background:#f0f8ff;
}

h1{
    color:#003366;
    margin:10px;
}

#message{
    font-size:30px;
    font-weight:bold;
    margin:10px;
}

#game{
    position:relative;
    width:100vw;
    height:75vh;
}

.number{
    position:absolute;
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    background:#4da6ff;
    color:white;
    font-size:42px;
    font-weight:bold;
}

.correct{
    background:#4CAF50 !important;
}

.hint{
    background:orange !important;
    animation:blink 0.8s infinite;
}

@keyframes blink{
    50%{
        opacity:0.3;
    }
}

#clear{
    margin-top:15px;
    font-size:40px;
    color:green;
    font-weight:bold;
}

.restart{
    font-size:28px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    color:white;
}
</style>
</head>

<body>

<h1>ナンバータッチ</h1>

<div id="message">1を押そう！</div>

<div id="game"></div>

<div id="clear"></div>

<script>

const MAX_NUMBER = 10;

let nextNumber = 1;
let wrongCount = 0;

const game = document.getElementById("game");

function createGame(){

    nextNumber = 1;
    wrongCount = 0;

    game.innerHTML = "";
    document.getElementById("clear").innerHTML = "";
    document.getElementById("message").textContent =
        "1を押そう！";

    const positions = [];

    for(let i = 1; i <= MAX_NUMBER; i++){

        let x;
        let y;
        let overlap;

        do{

            overlap = false;

            x = Math.random() * (window.innerWidth - 100);
            y = Math.random() * (window.innerHeight * 0.65);

            for(const p of positions){

                const dx = x - p.x;
                const dy = y - p.y;

                const distance =
                    Math.sqrt(dx * dx + dy * dy);

                if(distance < 110){
                    overlap = true;
                    break;
                }
            }

        }while(overlap);

        positions.push({x:x,y:y});

        const button =
            document.createElement("button");

        button.className = "number";
        button.textContent = i;
